      <h2>Импорт результатов вручную</h2>
      <p class="small muted">Резервный способ: загрузите файлы результатов (.json), экспортированные сотрудниками из личного кабинета.</p>
      <div class="filebox" id="dropZone">
        <input type="file" id="fileInput" multiple accept=".json" style="margin-bottom:8px;">
        <div>Выберите один или несколько файлов *.json</div>
      </div>
      <p class="small" id="importMsg" style="margin-top:8px;">${lastImportMsg}</p>
    </div>
    <div class="card">
      <h2>Все пользователи</h2>
      <p class="small muted">Логины и пароли доступны здесь, только если синхронизация с сервером настроена (ниже) — без неё видны лишь аккаунты, зарегистрированные в этом браузере, и логины, известные по присланным результатам (без пароля).</p>
      ${userLogins.length === 0 ? `<p class="muted small">Пока нет ни одного пользователя — зарегистрируйтесь сами или дождитесь сотрудников.</p>` : `
      <div style="overflow-x:auto;"><table><thead><tr><th>ФИО</th><th>Логин</th><th>Пароль</th><th>Роль</th><th>Дата регистрации</th><th>Попыток</th><th>Лучшие результаты по тестам</th><th></th></tr></thead><tbody>${overviewRows}</tbody></table></div>
      <div class="row" style="margin-top:12px;">
        <button class="btn secondary" id="btnExportCsv">Скачать сводную таблицу (CSV)</button>
        <button class="btn secondary" id="btnExportAllJson">Скачать все результаты (JSON)</button>
      </div>`}
    </div>
    <div id="userDetail"></div>
  `;

  document.getElementById("fileInput").onchange = (ev) => {
    const files = Array.from(ev.target.files || []);
    let imported = 0, alreadyHad = 0, badFiles = 0;
    const newlyImported = [];
    let pending = files.length;
    if (!pending) return;
    files.forEach(f => {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          const arr = Array.isArray(data) ? data : [data];
          const store = loadResults();
          const ids = new Set(store.map(x=>x.id));
          arr.forEach(rec => {
            if (!rec || !rec.id) { badFiles++; return; }
            if (ids.has(rec.id)) { alreadyHad++; return; }
            store.push(rec); ids.add(rec.id); imported++; newlyImported.push(rec);
          });
          saveResults(store);
        } catch(e){ badFiles++; }
        pending--;
        if (pending === 0){
          lastImportMsg = `Импортировано новых записей: ${imported}. Уже были в системе: ${alreadyHad}. Не удалось прочитать: ${badFiles}.`;
          if (newlyImported.length && syncConfigured()){
            lastImportMsg += ` Отправляю на сервер…`;
            renderAdmin();
            Promise.all(newlyImported.map(rec => pushResultToServer(rec))).then(results => {
              const sent = results.filter(r => r.ok).length;
              lastImportMsg = `Импортировано новых записей: ${imported}. Уже были в системе: ${alreadyHad}. Не удалось прочитать: ${badFiles}. Отправлено на сервер: ${sent} из ${newlyImported.length}.`;
              renderAdmin();
            });
          } else {
            renderAdmin();
          }
        }
      };
      reader.readAsText(f, "utf-8");
    });
  };

  appEl.querySelectorAll("[data-user]").forEach(btn => {
    btn.onclick = () => renderUserDetail(btn.dataset.user, users[btn.dataset.user]);
  });

  const csvBtn = document.getElementById("btnExportCsv");
  if (csvBtn) csvBtn.onclick = () => {
    const rows = [["ФИО","Логин","Тест","Категория","Дата","Верно","Всего","Процент","Оценка"]];
    results.forEach(r => rows.push([r.fullName, r.login, r.testLabel, r.label, fmtDate(r.dateISO), r.correctCount, r.totalQuestions, r.percent.toFixed(1), r.bandLabel]));
    downloadCSV(rows, "attestation_summary.csv");
  };
  const jsonBtn = document.getElementById("btnExportAllJson");
  if (jsonBtn) jsonBtn.onclick = () => downloadJSON(results, "attestation_all_results.json");

  const syncNowBtn = document.getElementById("btnSyncNow");
  if (syncNowBtn) syncNowBtn.onclick = () => {
    lastSyncPullMsg = "Синхронизирую…";
    renderAdmin();
    Promise.all([pullResultsFromServer(), pullProfilesFromServer()]).then(([resResults, resUsers]) => {
      lastSyncPullMsg = (resResults.ok && resUsers.ok)
        ? `Синхронизировано ${fmtDate(new Date().toISOString())}: новых результатов — ${resResults.imported}, новых/обновлённых пользователей — ${resUsers.imported}.`
        : `Не удалось синхронизироваться: ${resResults.reason || resUsers.reason}`;
      renderAdmin();
    });
  };
  const saveSyncBtn = document.getElementById("btnSaveSync");
  if (saveSyncBtn) saveSyncBtn.onclick = () => {
    const url = document.getElementById("syncUrl").value.trim();
    const secret = document.getElementById("syncSecret").value.trim();
    if (!url){ alert("Укажите ссылку Web App."); return; }
    setSyncOverride({url, secret});
    autoSyncDone = false;
    renderAdmin();
  };
  const openQbankBtn = document.getElementById("btnOpenQbank");
  if (openQbankBtn) openQbankBtn.onclick = () => { route = "qbank"; render(); };

  document.getElementById("btnDownloadTemplate").onclick = () => {
    downloadJSON(customTestTemplate(), "shablon_svoego_testa.json");
  };
  appEl.querySelectorAll("[data-del-test]").forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.delTest;
      const t = getAllTests().find(x => x.id === id);
      if (!confirm("Удалить тест «" + (t ? t.positionTitle + " — " + t.label : id) + "» на сервере? Он пропадёт у всех сотрудников. Уже сданные попытки в статистике останутся.")) return;
      btn.disabled = true;
      const res = await deleteTest(id);
      if (!res.ok){ alert("Не удалось удалить тест: " + res.reason); btn.disabled = false; return; }
      renderAdmin();
    };
  });
  document.getElementById("customTestFileInput").onchange = (ev) => {
    const file = (ev.target.files || [])[0];
    const msgEl = document.getElementById("customTestMsg");
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch(e){
        lastCustomTestMsgColor = "var(--bad)";
        lastCustomTestMsg = "Не удалось прочитать файл: это не корректный JSON.";
        msgEl.style.color = lastCustomTestMsgColor; msgEl.textContent = lastCustomTestMsg;
        return;
      }
      const items = Array.isArray(parsed) ? parsed : [parsed];
      const errors = [];
      const validTests = [];
      items.forEach((raw, i) => {
        const res = validateCustomTestObj(raw, items.length > 1 ? "тест " + (i+1) : null);
        if (res.ok) validTests.push(res.test); else errors.push(...res.errors);
      });
      if (errors.length){
        lastCustomTestMsgColor = "var(--bad)";
        lastCustomTestMsg = "Файл не загружен, найдены ошибки:\n— " + errors.slice(0, 20).join("\n— ") + (errors.length > 20 ? `\n…и ещё ${errors.length - 20}.` : "");
        msgEl.style.color = lastCustomTestMsgColor; msgEl.textContent = lastCustomTestMsg;
        return;
      }
      lastCustomTestMsgColor = "var(--muted)";
      lastCustomTestMsg = "Загружаю на сервер…";
      msgEl.style.color = lastCustomTestMsgColor; msgEl.textContent = lastCustomTestMsg;
      const results = await Promise.all(validTests.map(t => saveTestToServer({...t, order: TESTS.length})));
      const failed = results.filter(r => !r.ok);
      if (failed.length){
        lastCustomTestMsgColor = "var(--bad)";
        lastCustomTestMsg = "Не удалось сохранить на сервере: " + failed.map(r=>r.reason).join("; ");
        msgEl.style.color = lastCustomTestMsgColor; msgEl.textContent = lastCustomTestMsg;
        return;
      }
      validTests.forEach(t => TESTS.push({...t, totalQuestions: t.sections.reduce((a,s)=>a+s.questions.length,0)}));
      const qCount = validTests.reduce((a,t)=>a+t.sections.reduce((b,s)=>b+s.questions.length,0), 0);
      lastCustomTestMsgColor = "var(--good)";
      lastCustomTestMsg = `Загружено тестов: ${validTests.length} (вопросов: ${qCount}). Сохранено на сервере — теперь видны всем сотрудникам.`;
      renderAdmin();
    };
    reader.readAsText(file, "utf-8");
  };

  // ---------- roles: which tests each role sees (saved to the server on every change) ----------
  // Optimistic update: ROLES is changed in-memory immediately (the checkbox already
  // reflects the click visually), then enqueueRolesSave serialises the network writes
  // so rapid clicks never race and overwrite each other on the server.
  appEl.querySelectorAll(".role-test-cb").forEach(cb => {
    cb.onchange = () => {
      const roles = ROLES.map(r => ({...r, testIds: [...(r.testIds || [])]}));
      const role = roles.find(r => r.id === cb.dataset.role);
      if (!role) return;
      const testId = cb.dataset.test;
      if (cb.checked){ if (!role.testIds.includes(testId)) role.testIds.push(testId); }
      else { role.testIds = role.testIds.filter(id => id !== testId); }
      ROLES = roles;
      enqueueRolesSave(); // no rerender — checkbox visual state is already correct
    };
  });
  appEl.querySelectorAll(".role-name-input").forEach(inp => {
    inp.onchange = () => {
      const roles = ROLES.map(r => ({...r}));
      const role = roles.find(r => r.id === inp.dataset.role);
      if (!role) return;
      role.name = inp.value.trim() || role.name;
      ROLES = roles;
      enqueueRolesSave(); // no rerender — name is already visible in the input field
    };
  });
  const addRoleBtn = document.getElementById("btnAddRole");
  if (addRoleBtn) addRoleBtn.onclick = () => {
    const name = prompt("Название новой роли:");
    if (!name || !name.trim()) return;
    const id = "role_" + Date.now().toString(36);
    ROLES = [...ROLES, {id, name: name.trim(), testIds: []}];
    enqueueRolesSave({ rerender: true }); // rerender needed to show the new role's checkboxes
  };
  appEl.querySelectorAll("[data-del-role]").forEach(btn => {
    btn.onclick = () => {
      const roleId = btn.dataset.delRole;
      if (!confirm("Удалить эту роль? Пользователи с этой ролью будут переведены на роль «Пользователь».")) return;
      ROLES = ROLES.filter(r => r.id !== roleId).map(r => ({...r}));
      // Reassign anyone on this role, in every local cache, so nothing keeps pointing at
      // a role id that no longer exists — then push each reassigned user to the server.
      [loadProfiles(), loadSyncedProfiles()].forEach((list, i) => {
        let changed = false;
        list.forEach(p => { if (p.role === roleId){ p.role = DEFAULT_ROLE_ID; changed = true; pushProfileToServer(p); } });
        if (changed) (i === 0 ? saveProfiles : saveSyncedProfiles)(list);
      });
      enqueueRolesSave({ rerender: true }); // rerender to remove the deleted role's card
    };
  });
  appEl.querySelectorAll(".user-role-select").forEach(sel => {
    sel.onchange = () => {
      const login = sel.dataset.login;
      const roleId = sel.value;
      const synced = loadSyncedProfiles();
      const syncedIdx = synced.findIndex(p => p.login === login);
      if (syncedIdx !== -1){ synced[syncedIdx] = {...synced[syncedIdx], role: roleId}; saveSyncedProfiles(synced); }
      const local = loadProfiles();
      const localIdx = local.findIndex(p => p.login === login);
      if (localIdx !== -1){ local[localIdx] = {...local[localIdx], role: roleId}; saveProfiles(local); }
      const full = localIdx !== -1 ? local[localIdx] : (syncedIdx !== -1 ? synced[syncedIdx] : {login, role: roleId});
      pushProfileToServer(full);
    };
  });
}

// ---------- QUESTION BANK VIEWER + EDITOR (admin) ----------
let qbankEditing = null; // null | {sectionTitle, id: string|null (null = adding new), draft:{q,options,correctSet}}

function emptyDraft(){ return { q:"", options:["","","","","","","",""], correctSet:new Set() }; }

function renderQuestionEditForm(sectionTitle, draft, isNew){
  const optsHtml = draft.options.map((opt, oi) => `
    <div class="row" style="align-items:center;gap:8px;margin-bottom:6px;">
      <input type="checkbox" data-cor="${oi}" ${draft.correctSet.has(oi) ? "checked" : ""}>
      <input type="text" data-opt="${oi}" value="${escapeHtml(opt)}" placeholder="Вариант ${oi+1}" style="flex:1;margin-bottom:0;">
    </div>`).join("");
  return `
    <div class="card" id="qbEditCard" style="border-color:var(--accent);">
      <h3 style="margin-top:0;">${isNew ? "Новый вопрос" : "Редактирование вопроса"} — ${escapeHtml(sectionTitle)}</h3>
      <label for="qbQText">Текст вопроса</label>
      <textarea id="qbQText" rows="3" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:6px;font-size:14px;margin-bottom:14px;">${escapeHtml(draft.q)}</textarea>
      <label>Варианты ответов (отметьте галочкой правильный(-е) вариант(ы))</label>
      ${optsHtml}
      <p class="small muted">Отметите один вариант — вопрос будет с одним правильным ответом; несколько — с множественным выбором.</p>
      <div class="row" style="margin-top:10px;">
        <button class="btn" id="qbSave">Сохранить</button>
        <button class="btn ghost" id="qbCancel">Отмена</button>
      </div>
      <p class="small" id="qbFormMsg" style="color:var(--bad);"></p>
    </div>`;
}

// The edit/add form now renders inline at the question's own position in the list
// (see renderQuestionBank), so after re-rendering we just need to keep the page from
// snapping back to the top — restore the scroll position it had a moment ago.
function rerenderQbankPreservingScroll(){
  const y = window.scrollY;
  renderQuestionBank();
  window.scrollTo(0, y);
}

function startAddQuestion(sectionTitle){
  qbankEditing = { sectionTitle, id: null, draft: emptyDraft() };
  renderQuestionBank();
  const el = document.getElementById("qbEditCard"); if (el) el.scrollIntoView({behavior:"smooth", block:"center"});
}
function startEditQuestion(sectionTitle, q){
  qbankEditing = { sectionTitle, id: q.id, draft: { q: q.q, options: q.options.slice(), correctSet: new Set(q.correct) } };
  renderQuestionBank();
  const el = document.getElementById("qbEditCard"); if (el) el.scrollIntoView({behavior:"smooth", block:"center"});
}
function cancelQbEdit(){ qbankEditing = null; rerenderQbankPreservingScroll(); }

// Saves straight to the server (Google Sheet) and updates this browser's in-memory copy
// of TESTS on success, so the change is visible here immediately too, without a reload.
async function saveQbEdit(){
  const qText = document.getElementById("qbQText").value.trim();
  const optionInputs = Array.from(document.querySelectorAll('#qbEditCard input[data-opt]'));
  const options = optionInputs.map(inp => inp.value.trim());
  const corInputs = Array.from(document.querySelectorAll('#qbEditCard input[data-cor]'));
  const correct = corInputs.filter(c => c.checked).map(c => Number(c.dataset.cor));
  const msg = document.getElementById("qbFormMsg");
  if (!qText){ msg.textContent = "Введите текст вопроса."; return; }
  if (options.some(o => !o)){ msg.textContent = "Заполните все 8 вариантов ответа."; return; }
  if (new Set(options).size !== 8){ msg.textContent = "Варианты ответов должны быть уникальными."; return; }
  if (correct.length === 0){ msg.textContent = "Отметьте хотя бы один правильный вариант."; return; }

  const t = getAllTests().find(x => x.id === qbankTestId);
  const sec = t.sections.find(s => s.title === qbankEditing.sectionTitle);
  const isNew = qbankEditing.id === null;
  // localIdx stays 0-based — it indexes the actual JS array (sec.questions). questionOrder
  // sent to the server is 1-based (matches how questions are numbered everywhere else in
  // the app and in the Questions sheet itself) — the two must NOT be conflated, or saving
  // an edit overwrites the wrong question in this browser's own in-memory copy until the
  // next reload (the server itself stays correct, since it upserts by id, not by index).
  const localIdx = isNew ? -1 : sec.questions.findIndex(q => q.id === qbankEditing.id);
  const sectionOrder = t.sections.indexOf(sec) + 1;
  const questionOrder = (isNew ? sec.questions.length : localIdx) + 1;

  msg.style.color = "var(--muted)"; msg.textContent = "Сохраняю…";
  const saveBtn = document.getElementById("qbSave"); if (saveBtn) saveBtn.disabled = true;
  const res = await saveQuestionToServer({
    id: qbankEditing.id || undefined, testId: t.id, sectionTitle: qbankEditing.sectionTitle,
    sectionOrder, questionOrder, q: qText, options, correct,
  });
  if (!res.ok){
    msg.style.color = "var(--bad)";
    msg.textContent = "Не удалось сохранить: " + res.reason + ". Попробуйте ещё раз.";
    if (saveBtn) saveBtn.disabled = false;
    return;
  }
  const newQ = { id: res.id, q: qText, options, correct };
  if (isNew) sec.questions.push(newQ);
  else sec.questions[localIdx] = newQ;
  t.totalQuestions = t.sections.reduce((a,s)=>a+s.questions.length, 0);
  qbankEditing = null;
  rerenderQbankPreservingScroll();
}

async function deleteQbQuestion(sectionTitle, q){
  if (!confirm("Удалить этот вопрос из базы вопросов на сервере? Это затронет всех сотрудников и необратимо.")) return;
  const t = getAllTests().find(x => x.id === qbankTestId);
  const res = await deleteQuestionFromServer(q.id);
  if (!res.ok){ alert("Не удалось удалить вопрос: " + res.reason); return; }
  const sec = t.sections.find(s => s.title === sectionTitle);
  sec.questions = sec.questions.filter(x => x.id !== q.id);
  t.totalQuestions = t.sections.reduce((a,s)=>a+s.questions.length, 0);
  if (qbankEditing && qbankEditing.id === q.id) qbankEditing = null;
  rerenderQbankPreservingScroll();
}

function renderQuestionBank(){
  if (!isAdmin()){ route = "admin"; return renderAdmin(); }
  if (!syncConfigured()){
    appEl.innerHTML = `
      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:center;">
          <h2 style="margin:0;">База вопросов</h2>
          <button class="btn ghost" id="btnBackAdmin">← В админку</button>
        </div>
        <p class="small" style="color:var(--bad);">Синхронизация с сервером не настроена. Банк вопросов хранится в Google Таблице и без синхронизации недоступен — настройте её в админке.</p>
      </div>`;
    document.getElementById("btnBackAdmin").onclick = () => { route = "admin"; render(); };
    return;
  }
  if (!qbankTestId || !getAllTests().find(t => t.id === qbankTestId)) qbankTestId = (getAllTests()[0] || {}).id || null;
  if (!qbankTestId){
    appEl.innerHTML = `
      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:center;">
          <h2 style="margin:0;">База вопросов</h2>
          <button class="btn ghost" id="btnBackAdmin">← В админку</button>
        </div>
        <p class="small muted">Тестов пока нет.</p>
      </div>`;
    document.getElementById("btnBackAdmin").onclick = () => { route = "admin"; render(); };
    return;
  }
  const t = getAllTests().find(x => x.id === qbankTestId);

  const groups = {};
  getAllTests().forEach(x => { (groups[x.group] = groups[x.group] || []).push(x); });
  let optionsHtml = "";
  for (const g in groups){
    optionsHtml += `<optgroup label="${escapeHtml(groups[g][0].groupLabel)}">`;
    groups[g].forEach(x => {
      optionsHtml += `<option value="${x.id}" ${x.id === qbankTestId ? "selected" : ""}>${escapeHtml(x.positionTitle)} — ${escapeHtml(x.label)}</option>`;
    });
    optionsHtml += `</optgroup>`;
  }

  const qIndex = {};
  let sectionsHtml = "";
  let globalQNum = 0;
  t.sections.forEach(sec => {
    sectionsHtml += `<div class="section-title">${escapeHtml(sec.title)} <span class="small muted">(${sec.questions.length} вопросов)</span></div>`;
    sec.questions.forEach((q) => {
      globalQNum++;
      qIndex[q.id] = q;
      // Editing this exact question — show the edit form right here, in place of the
      // question card, instead of a separate card elsewhere on the page (which used to
      // force a jump to the top of "База вопросов" and made it hard to find your way
      // back to the question you were editing).
      if (qbankEditing && qbankEditing.id !== null && qbankEditing.id === q.id && qbankEditing.sectionTitle === sec.title){
        sectionsHtml += renderQuestionEditForm(sec.title, qbankEditing.draft, false);
        return;
      }
      const isMulti = q.correct.length > 1;
      const optsHtml = q.options.map((opt, oi) => {
        const isCorrect = q.correct.includes(oi);
        return `<div class="opt${isCorrect ? " qb-correct" : ""}"><span class="qb-check">${isCorrect ? "✓" : ""}</span><span>${escapeHtml(opt)}</span></div>`;
      }).join("");
      sectionsHtml += `
        <div class="q-block">
          <div class="row" style="justify-content:space-between;align-items:flex-start;">
            <div class="q-num">Вопрос ${globalQNum} из ${t.totalQuestions}${isMulti ? " · возможно более одного правильного варианта" : ""}</div>
            <div class="row" style="gap:6px;">
              <button class="btn ghost qb-edit-btn" data-sec="${escapeHtml(sec.title)}" data-id="${escapeHtml(q.id)}" style="padding:2px 10px;font-size:12px;">Редактировать</button>
              <button class="btn ghost qb-del-btn" data-sec="${escapeHtml(sec.title)}" data-id="${escapeHtml(q.id)}" style="padding:2px 10px;font-size:12px;color:var(--bad);">Удалить</button>
            </div>
          </div>
          <div class="q-text">${escapeHtml(q.q)}</div>
          ${optsHtml}
        </div>`;
    });
    // Adding a new question to this section — show the form right after its question
    // list, in the same spot as before, instead of jumping elsewhere.
    if (qbankEditing && qbankEditing.id === null && qbankEditing.sectionTitle === sec.title){
      sectionsHtml += renderQuestionEditForm(sec.title, qbankEditing.draft, true);
    }
    sectionsHtml += `<div class="row" style="margin:4px 0 24px;"><button class="btn secondary qb-add-btn" data-sec="${escapeHtml(sec.title)}" style="font-size:13px;">+ Добавить вопрос в раздел «${escapeHtml(sec.title)}»</button></div>`;
  });

  appEl.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center;">
        <h2 style="margin:0;">База вопросов</h2>
        <button class="btn ghost" id="btnBackAdmin">← В админку</button>
      </div>
      <p class="small muted">Правильные варианты отмечены галочкой и выделены зелёным. Изменения сохраняются в Google Таблицу сразу и видны всем, кто откроет приложение. Видно только администратору.</p>
      <label for="qbankSelect">Тест</label>
      <select id="qbankSelect" style="width:100%;">${optionsHtml}</select>
      <p class="small muted" style="margin-top:8px;">${t.totalQuestions} вопросов, ${t.sections.length} разделов</p>
    </div>
    <div class="card">
      ${sectionsHtml}
    </div>
  `;
  document.getElementById("btnBackAdmin").onclick = () => { qbankEditing = null; route = "admin"; render(); };
  document.getElementById("qbankSelect").onchange = (e) => { qbankEditing = null; qbankTestId = e.target.value; renderQuestionBank(); };
  appEl.querySelectorAll(".qb-add-btn").forEach(btn => { btn.onclick = () => startAddQuestion(btn.dataset.sec); });
  appEl.querySelectorAll(".qb-edit-btn").forEach(btn => { btn.onclick = () => startEditQuestion(btn.dataset.sec, qIndex[btn.dataset.id]); });
  appEl.querySelectorAll(".qb-del-btn").forEach(btn => { btn.onclick = () => deleteQbQuestion(btn.dataset.sec, qIndex[btn.dataset.id]); });
  const saveBtn = document.getElementById("qbSave"); if (saveBtn) saveBtn.onclick = saveQbEdit;
  const cancelBtn = document.getElementById("qbCancel"); if (cancelBtn) cancelBtn.onclick = cancelQbEdit;
}

// Removes an attempt everywhere it's tracked: local store, the "don't resurrect on
// sync" tombstone list, and (best-effort) the server sheet, so it doesn't come back
// on the next "Синхронизировать сейчас".
async function deleteAttempt(id){
  const store = loadResults().filter(x => x.id !== id);
  saveResults(store);
  addDeletedId(id);
  if (syncConfigured()){
    return await deleteResultFromServer(id);
  }
  return {ok:true, reason:"not-configured"};
}

function renderUserDetail(login, u){
  const box = document.getElementById("userDetail");
  // Aggregate per-section stats across all attempts for this user, grouped by test.
  const byTest = {};
  u.attempts.forEach(a => { (byTest[a.testId] = byTest[a.testId] || []).push(a); });

  let html = `<div class="card"><h2>${escapeHtml(u.fullName)} <span class="small muted">(${escapeHtml(login)})</span></h2>`;
  Object.keys(byTest).forEach(testId => {
    const attempts = byTest[testId].sort((a,b)=>b.dateISO.localeCompare(a.dateISO));
    const latest = attempts[0];
    html += `<h3>${escapeHtml(latest.testLabel)} — ${escapeHtml(latest.label)} <span class="small muted">(попыток: ${attempts.length}, последняя: ${fmtDate(latest.dateISO)})</span></h3>`;
    html += `<table><thead><tr><th>Раздел</th><th>Верно (последняя попытка)</th><th>%</th></tr></thead><tbody>`;
    latest.sections.forEach(sec => {
      const sb = bandFor(sec.percent);
      html += `<tr><td>${escapeHtml(sec.title)}</td><td>${sec.correct}/${sec.total}</td><td><span class="pill ${sb.cls}">${sec.percent.toFixed(0)}%</span></td></tr>`;
    });
    html += `</tbody></table>`;
    const weak = latest.sections.filter(s=>s.percent<60).map(s=>s.title);
    const strong = latest.sections.filter(s=>s.percent>=85).map(s=>s.title);
    if (weak.length) html += `<p class="small"><strong>Слабые темы:</strong> ${weak.map(escapeHtml).join(", ")}</p>`;
    if (strong.length) html += `<p class="small"><strong>Сильные темы:</strong> ${strong.map(escapeHtml).join(", ")}</p>`;

    html += `<table style="margin-top:10px;"><thead><tr><th>Попытка</th><th>Дата</th><th>Результат</th><th></th></tr></thead><tbody>`;
    attempts.forEach((a, idx) => {
      const b = bandFor(a.percent);
      const hasDetails = Array.isArray(a.details) && a.details.length > 0;
      html += `<tr>
        <td>${attempts.length - idx}${idx===0 ? " (последняя)" : ""}</td>
        <td>${fmtDate(a.dateISO)}</td>
        <td>${a.correctCount}/${a.totalQuestions} <span class="pill ${b.cls}">${a.percent.toFixed(0)}%</span></td>
        <td>
          ${hasDetails ? `<button class="btn ghost" data-attempt="${a.id}">Вопросы и ответы</button> <button class="btn ghost" data-download-report="${a.id}">Скачать отчёт</button>` : `<span class="small muted">детализация недоступна</span>`}
          <button class="btn ghost" data-delete-attempt="${a.id}" style="color:var(--bad);border-color:var(--bad);">Удалить</button>
        </td>
      </tr>`;
    });
    html += `</tbody></table>`;
  });
  html += `</div>`;
  box.innerHTML = html;
  box.querySelectorAll("[data-attempt]").forEach(btn => {
    btn.onclick = () => { attemptDetailId = btn.dataset.attempt; attemptDetailBack = "admin"; route = "attemptDetail"; render(); };
  });
  box.querySelectorAll("[data-download-report]").forEach(btn => {
    btn.onclick = () => {
      const a = loadResults().find(x => x.id === btn.dataset.downloadReport);
      if (a) downloadHTML(buildReportHTML(a), reportFilename(a));
    };
  });
  box.querySelectorAll("[data-delete-attempt]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Удалить эту попытку без возможности восстановления? Она будет удалена и локально, и (если настроена синхронизация) из Google-таблицы.")) return;
      btn.disabled = true;
      btn.textContent = "Удаляю…";
      const res = await deleteAttempt(btn.dataset.deleteAttempt);
      if (!res.ok && res.reason !== "not-configured"){
        alert("Удалено локально, но не удалось удалить на сервере: " + res.reason + "\nПри следующей синхронизации запись не вернётся — она помечена как удалённая, но стоит проверить сервер вручную, если это важно.");
      }
      refreshAdminAndReopenUser(login);
    };
  });
  box.scrollIntoView({behavior:"smooth"});
}

function refreshAdminAndReopenUser(login){
  renderAdmin();
  if (!login) return;
  const attempts = loadResults().filter(r => r.login === login);
  if (attempts.length){
    renderUserDetail(login, {fullName: attempts[0].fullName, login, attempts});
  }
}

// ---------- standalone report export (self-contained HTML file for handing to the candidate) ----------
function buildReportHTML(r){
  const details = Array.isArray(r.details) ? r.details : [];
  const b = bandFor(r.percent);
  const sections = Array.isArray(r.sections) ? r.sections : [];

  const sectionsHtml = sections.length ? `
    <table>
      <thead><tr><th>Раздел</th><th>Верно</th><th>Всего</th><th>%</th></tr></thead>
      <tbody>
        ${sections.map(sec => `<tr><td>${escapeHtml(sec.title)}</td><td>${sec.correct}</td><td>${sec.total}</td><td>${sec.percent.toFixed(1)}%</td></tr>`).join("")}
      </tbody>
    </table>` : "";

  let qHtml = "";
  if (!details.length){
    qHtml = `<p class="small muted">Подробная детализация по вопросам недоступна для этой попытки (она сдана до появления этой функции).</p>`;
  } else {
    details.forEach((d, i) => {
      const optsHtml = d.options.map((opt, oi) => {
        const isCorrect = d.correctIdx.includes(oi);
        const isGiven = d.givenIdx.includes(oi);
        let cls = "";
        if (isCorrect) cls = " qb-correct";
        if (isGiven && !isCorrect) cls = " attempt-wrong";
        let mark = "";
        if (isCorrect) mark = "✓";
        else if (isGiven) mark = "✗";
        return `<div class="opt${cls}"><span class="qb-check">${mark}</span><span>${escapeHtml(opt)}</span>${isGiven ? ` <span class="small muted">(ответ тестируемого)</span>` : ""}</div>`;
      }).join("");
      qHtml += `
        <div class="q-block ${d.isCorrect ? "" : "attempt-q-wrong"}">
          <div class="q-num">Вопрос ${i+1} из ${details.length} · ${escapeHtml(d.sectionTitle)} · ${d.isCorrect ? "верно" : "неверно"}</div>
          <div class="q-text">${escapeHtml(d.q)}</div>
          ${optsHtml}
        </div>`;
    });
  }

  return `<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отчёт — ${escapeHtml(r.fullName)} — ${escapeHtml(r.testLabel)}</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --border:#dde3ea; --text:#1c2733; --muted:#647082;
    --accent:#2563eb; --good:#16a34a; --warn:#d97706; --bad:#dc2626;
    --good-bg:#eafaf0; --warn-bg:#fff7e6; --bad-bg:#fdecec;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--panel);border-bottom:1px solid var(--border);padding:14px 24px;}
  header h1{font-size:18px;margin:0;}
  main{max-width:980px;margin:0 auto;padding:24px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:24px;margin-bottom:20px;}
  h2{margin-top:0;font-size:20px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;}
  .pill.good{background:var(--good-bg);color:var(--good);}
  .pill.warn{background:var(--warn-bg);color:var(--warn);}
  .pill.bad{background:var(--bad-bg);color:var(--bad);}
  .q-block{border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px;}
  .q-num{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .q-text{font-size:15px;font-weight:600;margin-bottom:10px;}
  .opt{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:14px;}
  .muted{color:var(--muted);}
  .small{font-size:12px;color:var(--muted);}
  .opt.qb-correct{background:var(--good-bg);color:var(--good);font-weight:600;border-radius:6px;padding:6px 8px;}

</style>

<main>

    <button class="btn" onclick="window.print()">Печать / сохранить как PDF</button>

function reportFilename(r){
  const namePart = String(r.fullName || r.login || "candidate").replace(/[^\p{L}\p{N}]+/gu, "_").replace(/^_+|_+$/g, "");
  const datePart = (r.dateISO || "").slice(0,10);
  return `Отчёт_${namePart}_${datePart}.html`;
}

// ---------- init ----------
// TESTS/ROLES no longer ship baked into this file — they're fetched from the server on
// every load, so the app needs a moment before its first real render. A successful fetch
// is cached locally as a fallback for a later load with no connection; a first-ever load
// with neither a server nor a cache is a hard stop (nothing to show).
const LS_TESTS_CACHE = "att_tests_cache_v1";
const LS_ROLES_CACHE = "att_roles_cache_v1";

// Fetches tests+roles and caches whatever succeeded; never touches TESTS/ROLES for the
// half that failed (leaves the caller's current in-memory value, cache or otherwise, alone).
async function fetchAndCacheTestsAndRoles(){
  const [testsRes, rolesRes] = await Promise.all([fetchTestsFromServer(), fetchRolesFromServer()]);
  if (testsRes.ok) localStorage.setItem(LS_TESTS_CACHE, JSON.stringify(TESTS));
  if (rolesRes.ok) localStorage.setItem(LS_ROLES_CACHE, JSON.stringify(ROLES));
  return {testsRes, rolesRes};
}

// Restores route/dashboardGroup/qbankTestId/etc. from the session + saved nav state.
// If the tab reloaded on its own (see saveNavState above) while an admin screen was
// open, go back there instead of dropping to the admin home screen. Routes with no
// meaningful state to resume (an in-progress test, a just-submitted result) fall back
// to the dashboard — an in-progress test attempt has its own resume prompt there.
function routeFromSession(){
  const s0 = getSession();
  if (s0){
    const nav = loadNavState();
    const restorableRoutes = ["admin", "qbank", "attemptDetail", "dashboard"];
    if (nav && restorableRoutes.includes(nav.route)){
      route = nav.route;
      dashboardGroup = nav.dashboardGroup || null;
      qbankTestId = nav.qbankTestId || null;
      attemptDetailId = nav.attemptDetailId || null;
      attemptDetailBack = nav.attemptDetailBack || "admin";
    } else {
      route = "dashboard";
    }
  } else {
    route = "login";
  }
}

// After painting from cache, quietly re-fetch and re-render only if something actually
// changed, and only on screens where swapping data under the user is safe — never during
// test-taking/result review, and never on the login screen (would wipe a half-typed
// login/password out from under the user's fingers).
async function refreshTestsAndRolesInBackground(){
  const prevTests = JSON.stringify(TESTS);
  const prevRoles = JSON.stringify(ROLES);
  const {testsRes, rolesRes} = await fetchAndCacheTestsAndRoles();
  const changed = (testsRes.ok && JSON.stringify(TESTS) !== prevTests) ||
                  (rolesRes.ok && JSON.stringify(ROLES) !== prevRoles);
  const safeRoutes = ["dashboard", "admin", "qbank"];
  if (changed && safeRoutes.includes(route)) render();
}

async function bootApp(){
  if (syncConfigured()){
    let cachedTests = null, cachedRoles = null;
    try { cachedTests = JSON.parse(localStorage.getItem(LS_TESTS_CACHE)); } catch(e){}
    try { cachedRoles = JSON.parse(localStorage.getItem(LS_ROLES_CACHE)); } catch(e){}

    if (Array.isArray(cachedTests) && cachedTests.length){
      // Cache-first: paint immediately with what we have, refresh silently in the
      // background — the ~5-30s Apps Script cold start no longer blocks the first paint.
      TESTS = cachedTests;
      ROLES = Array.isArray(cachedRoles) ? cachedRoles : [];
      routeFromSession();
      render();
      refreshTestsAndRolesInBackground();
      return;
    }

    // No usable cache yet (first-ever load on this device/browser) — nothing to show,
    // so this one has to actually wait for the server. Make that wait visible.
    appEl.innerHTML = loadingScreenHtml("Загружаю тесты…", "Это может занять до 30 секунд при первом заходе за день — сервер «просыпается».");
    const {testsRes} = await fetchAndCacheTestsAndRoles();

    if (!testsRes.ok && !TESTS.length){
      appEl.innerHTML = `
        <div class="card" style="max-width:480px;margin:40px auto;">
          <h2>Не удалось загрузить тесты</h2>
          <p class="small" style="color:var(--bad);">${escapeHtml(testsRes.reason || "")}</p>
          <p class="small muted">Проверьте интернет-соединение и повторите.</p>
          <button class="btn" id="btnRetryBoot">Повторить</button>
        </div>`;
      document.getElementById("btnRetryBoot").onclick = () => bootApp();
      return;
    }
  }

  routeFromSession();
  render();
}

bootApp();
</script>
