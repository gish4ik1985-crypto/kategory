<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аттестация — тестирование персонала</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --border:#dde3ea; --text:#1c2733; --muted:#647082;
    --accent:#2563eb; --accent-dark:#1d4ed8; --good:#16a34a; --warn:#d97706; --bad:#dc2626;
    --good-bg:#eafaf0; --warn-bg:#fff7e6; --bad-bg:#fdecec;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--panel);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
  header h1{font-size:18px;margin:0;}
  header .who{font-size:13px;color:var(--muted);display:flex;gap:12px;align-items:center;}
  header button{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--text);}
  header button:hover{background:var(--bg);}
  main{max-width:980px;margin:0 auto;padding:24px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:24px;margin-bottom:20px;}
  h2{margin-top:0;font-size:20px;}
  h3{font-size:16px;margin:18px 0 8px;}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;}
  input[type=text],input[type=password]{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:6px;font-size:14px;margin-bottom:14px;}
  .btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:10px 18px;font-size:14px;cursor:pointer;}
  .btn:hover{background:var(--accent-dark);}
  .btn.secondary{background:none;color:var(--accent);border:1px solid var(--accent);}
  .btn.secondary:hover{background:#eef4ff;}
  .btn.ghost{background:none;color:var(--muted);border:1px solid var(--border);}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .test-tile{border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;background:#fafcff;}
  .test-tile:hover{border-color:var(--accent);}
  .test-tile .grp{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.03em;}
  .test-tile .lbl{font-size:16px;font-weight:600;margin:4px 0;}
  .test-tile .meta{font-size:12px;color:var(--muted);}
  .test-tile.locked{cursor:not-allowed;background:#f4f5f7;opacity:.72;}
  .test-tile.locked:hover{border-color:var(--border);}
  .test-tile .lock-note{font-size:12px;color:var(--warn);margin-top:6px;}
  .group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .group-tile{border:1px solid var(--border);border-radius:10px;padding:22px 18px;cursor:pointer;background:#fafcff;text-align:left;}
  .group-tile:hover{border-color:var(--accent);}
  .group-tile .g-title{font-size:18px;font-weight:700;margin-bottom:6px;}
  .group-tile .g-desc{font-size:13px;color:var(--muted);line-height:1.4;}
  .back-link{display:inline-block;margin-bottom:14px;background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;padding:0;}
  .back-link:hover{text-decoration:underline;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;}
  .pill.good{background:var(--good-bg);color:var(--good);}
  .pill.warn{background:var(--warn-bg);color:var(--warn);}
  .pill.bad{background:var(--bad-bg);color:var(--bad);}
  .q-block{border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px;}
  .q-num{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .q-text{font-size:15px;font-weight:600;margin-bottom:10px;}
  .q-hint{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:10px;}
  .opt{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:14px;cursor:pointer;}
  .opt input{margin-top:3px;}
  .progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:18px;}
  .progress-bar > div{height:100%;background:var(--accent);}
  .sticky-actions{position:sticky;bottom:0;background:var(--bg);padding:14px 0;border-top:1px solid var(--border);margin-top:6px;}
  .muted{color:var(--muted);}
  .section-title{margin-top:26px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:6px;}
  .tabs{display:flex;gap:6px;margin-bottom:18px;}
  .tab{padding:8px 16px;border-radius:6px 6px 0 0;cursor:pointer;font-size:14px;color:var(--muted);border:1px solid transparent;}
  .tab.active{background:var(--panel);border:1px solid var(--border);border-bottom-color:var(--panel);color:var(--text);font-weight:600;margin-bottom:-1px;}
  [hidden]{display:none !important;}
  .score-big{font-size:44px;font-weight:700;}
  .band-good{color:var(--good);} .band-warn{color:var(--warn);} .band-bad{color:var(--bad);}
  .filebox{border:2px dashed var(--border);border-radius:8px;padding:20px;text-align:center;color:var(--muted);font-size:13px;}
  .small{font-size:12px;color:var(--muted);}
  .footer-note{font-size:12px;color:var(--muted);margin-top:24px;line-height:1.5;}
  select{padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;}
  .opt.qb-correct{background:var(--good-bg);color:var(--good);font-weight:600;border-radius:6px;padding:6px 8px;}
  .qb-check{width:16px;flex:0 0 16px;font-weight:700;}
  .opt.attempt-wrong{background:var(--bad-bg);color:var(--bad);font-weight:600;border-radius:6px;padding:6px 8px;}
  .q-block.attempt-q-wrong{border-color:var(--bad);}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px;flex:none;}
  .spinner-lg{width:32px;height:32px;border-width:3px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-block{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0;}
  .loading-hint{font-size:12px;color:var(--muted);margin:0;}
  @media print{
    .no-print{display:none !important;}
    header{display:none !important;}
    body{background:#fff;}
    .card{border:none;box-shadow:none;padding:0;margin-bottom:16px;break-inside:avoid;}
    .q-block{break-inside:avoid;}
  }
</style>
</head>
<body>

<header>
  <h1>Аттестация — тестирование персонала</h1>
  <div class="who" id="whoBox"></div>
</header>

<main id="app"></main>

<script>

// ---------- storage helpers ----------
const LS_PROFILES = "att_profiles_v1";
const LS_SYNCED_PROFILES = "att_synced_profiles_v1"; // other users' profiles pulled from the server (admin view)
const LS_RESULTS = "att_results_v1";
const LS_SESSION = "att_session_v1";
const LS_ADMIN = "att_admin_ok_v1";
const LS_DELETED_IDS = "att_deleted_ids_v1";
const LS_INPROGRESS = "att_inprogress_v1";
const LS_NAV_STATE = "att_nav_state_v1";
const DEFAULT_ROLE_ID = "user";
const ADMIN_PASSWORD = "655356012";

function loadProfiles(){ try{ return JSON.parse(localStorage.getItem(LS_PROFILES)) || []; }catch(e){ return []; } }
function saveProfiles(p){ localStorage.setItem(LS_PROFILES, JSON.stringify(p)); }
function loadSyncedProfiles(){ try{ return JSON.parse(localStorage.getItem(LS_SYNCED_PROFILES)) || []; }catch(e){ return []; } }
function saveSyncedProfiles(p){ localStorage.setItem(LS_SYNCED_PROFILES, JSON.stringify(p)); }
function loadResults(){ try{ return JSON.parse(localStorage.getItem(LS_RESULTS)) || []; }catch(e){ return []; } }
// Ids the admin explicitly deleted, so a later "Синхронизировать сейчас" pull doesn't
// silently resurrect them from the server (e.g. if the server-side delete failed/lagged).
function loadDeletedIds(){ try{ return JSON.parse(localStorage.getItem(LS_DELETED_IDS)) || []; }catch(e){ return []; } }
function addDeletedId(id){ const d = loadDeletedIds(); if (!d.includes(id)) d.push(id); localStorage.setItem(LS_DELETED_IDS, JSON.stringify(d)); }
function saveResults(r){ localStorage.setItem(LS_RESULTS, JSON.stringify(r)); }
function getSession(){ try{ return JSON.parse(localStorage.getItem(LS_SESSION)); }catch(e){ return null; } }
function setSession(s){ if(s) localStorage.setItem(LS_SESSION, JSON.stringify(s)); else localStorage.removeItem(LS_SESSION); }

// ---------- in-progress test attempts (resume support) ----------
// Keyed by "login::testId" so an interrupted/closed-tab attempt can be picked back up
// later — including the exact shuffled option order, so saved answer indices still
// point at the right options on resume.
function loadInProgressMap(){ try{ return JSON.parse(localStorage.getItem(LS_INPROGRESS)) || {}; }catch(e){ return {}; } }
function saveInProgressMap(m){ localStorage.setItem(LS_INPROGRESS, JSON.stringify(m)); }
function inProgressKey(login, testId){ return login + "::" + testId; }
function getInProgress(login, testId){ return loadInProgressMap()[inProgressKey(login, testId)] || null; }
function clearInProgress(login, testId){ const m = loadInProgressMap(); delete m[inProgressKey(login, testId)]; saveInProgressMap(m); }
function saveCurrentProgress(){
  if (!currentTest || !currentAttempt) return;
  const s = getSession();
  if (!s) return;
  const m = loadInProgressMap();
  m[inProgressKey(s.login, currentTest.id)] = {
    testId: currentTest.id,
    flat: currentTest.flat.map(q => ({
      sectionTitle: q.sectionTitle, q: q.q, displayOptions: q.displayOptions,
      correctIdx: [...q.correctSet], isMulti: q.isMulti,
    })),
    answers: currentAttempt.answers.map(a => [...a]),
    idx: currentAttempt.idx,
    startedAt: currentAttempt.startedAt,
    savedAt: Date.now(),
  };
  saveInProgressMap(m);
}
function isAdmin(){ return sessionStorage.getItem(LS_ADMIN) === "1"; }

// Remembers which admin screen (and which test/attempt within it) is open, per tab, so
// that if the browser reloads this tab on its own (memory-saver tab discarding, an
// accidental refresh) the admin lands back where they were instead of the admin home
// screen and having to re-open the test/attempt they were looking at.
function saveNavState(){
  try {
    sessionStorage.setItem(LS_NAV_STATE, JSON.stringify({
      route, dashboardGroup, qbankTestId, attemptDetailId, attemptDetailBack,
    }));
  } catch(e){}
}
function loadNavState(){
  try { return JSON.parse(sessionStorage.getItem(LS_NAV_STATE)); } catch(e){ return null; }
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// Small inline spinner + text, for use inside an existing <p>/<span> via innerHTML
// (e.g. a status message next to a button) — so it's clear something is happening,
// not stalled, during the ~5-30s Apps Script cold-start delay.
function spinnerInlineHtml(text){
  return `<span class="spinner"></span>${escapeHtml(text)}`;
}
// Full loading screen (spinner + message + optional hint line), for use as appEl.innerHTML
// while blocking on the very first server round-trip (no cache to show yet).
function loadingScreenHtml(text, hint){
  return `<div class="card" style="max-width:420px;margin:40px auto;text-align:center;">
    <div class="loading-block">
      <div class="spinner spinner-lg"></div>
      <p class="small muted" style="margin:0;">${escapeHtml(text)}</p>
      ${hint ? `<p class="loading-hint">${escapeHtml(hint)}</p>` : ""}
    </div>
  </div>`;
}
function fmtDate(iso){ const d = new Date(iso); return d.toLocaleDateString("ru-RU") + " " + d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}); }
function bandFor(percent){
  if (percent >= 90) return {label:"Отлично", cls:"good"};
  if (percent >= 75) return {label:"Хорошо", cls:"good"};
  if (percent >= 60) return {label:"Удовлетворительно (условно)", cls:"warn"};
  return {label:"Неудовлетворительно", cls:"bad"};
}
const PASS_PERCENT = 60; // minimum "уд" (Удовлетворительно) grade required to unlock advanced testing

// ---------- access levels: primary (kon_v2) -> advanced (kon_v1) gating ----------
// A handful of named accounts get unrestricted access to every test (including advanced
// tests) without having to clear the primary test first.
const FULL_ACCESS_FULLNAMES = ["Соловьев Евгений", "БАС"];
function hasFullAccess(session){
  if (!session) return false;
  const name = String(session.fullName || "").trim().toLowerCase();
  return FULL_ACCESS_FULLNAMES.some(n => n.trim().toLowerCase() === name);
}
// Advanced test id "kon_v1_cat3" -> its primary-test counterpart "kon_v2_cat3".
function primaryTestIdFor(advancedTestId){
  return advancedTestId.replace(/^kon_v1_/, "kon_v2_");
}
function hasPassedPrimary(loginResults, advancedTestId){
  const primaryId = primaryTestIdFor(advancedTestId);
  return loginResults.some(r => r.testId === primaryId && r.percent >= PASS_PERCENT);
}
// True if this test should be locked for this session right now.
function isTestLocked(test, session, loginResults){
  if (test.group !== "kon_v1") return false; // gating only applies to advanced testing
  if (hasFullAccess(session)) return false;
  return !hasPassedPrimary(loginResults, test.id);
}
function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function downloadCSV(rows, filename){
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(",")).join("\r\n");
  const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function downloadHTML(content, filename){
  const blob = new Blob([content], {type:"text/html;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

// ---------- question bank + roles: live on the server (Google Sheet) ----------
// TESTS and ROLES used to be baked into this file and edited via local-only overrides
// that had to be shipped to everyone else by hand (download a regenerated file, replace
// it on every computer). Now they're fetched from the server on load and every admin
// edit (question save/delete, whole-test upload/delete, role change) posts straight back
// to it — so anyone who (re)loads the app afterwards sees the same, current data with
// nothing to redistribute. See fetchTestsFromServer()/fetchRolesFromServer() below and
// the async boot sequence at the bottom of this script.
let TESTS = [];
let ROLES = [];

// --- roles save queue (prevents race when checkboxes are clicked rapidly) ---
let _rolesFlying = false;   // true while a saveRolesToServer request is in-flight
let _rolesDirty  = false;   // true if ROLES changed again while request was in-flight
let _rolesRerender = false; // true if renderAdmin() is needed after the queue drains

async function enqueueRolesSave({ rerender = false } = {}) {
  if (rerender) _rolesRerender = true;
  if (_rolesFlying) { _rolesDirty = true; return; }
  do {
    _rolesDirty = false;
    _rolesFlying = true;
    const res = await saveRolesToServer(ROLES);
    _rolesFlying = false;
    if (!res.ok && res.reason !== "not-configured") {
      alert("Не удалось сохранить роли: " + res.reason);
      _rolesRerender = false;
      return;
    }
  } while (_rolesDirty);
  if (_rolesRerender) { _rolesRerender = false; renderAdmin(); }
}

async function fetchTestsFromServer(){
  const cfg = getSyncConfig();
  if (!cfg.url) return {ok:false, reason:"not-configured"};
  try {
    const resp = await fetch(cfg.url + "?secret=" + encodeURIComponent(cfg.secret) + "&type=tests");
    const data = await resp.json();
    if (!data.ok) return {ok:false, reason: data.error || "server error"};
    TESTS = data.tests || [];
    return {ok:true};
  } catch(e){
    return {ok:false, reason: String(e && e.message || e)};
  }
}
async function fetchRolesFromServer(){
  const cfg = getSyncConfig();
  if (!cfg.url) return {ok:false, reason:"not-configured"};
  try {
    const resp = await fetch(cfg.url + "?secret=" + encodeURIComponent(cfg.secret) + "&type=roles");
    const data = await resp.json();
    if (!data.ok) return {ok:false, reason: data.error || "server error"};
    ROLES = data.roles || [];
    return {ok:true};
  } catch(e){
    return {ok:false, reason: String(e && e.message || e)};
  }
}
async function postToServer(body){
  const cfg = getSyncConfig();
  if (!cfg.url) return {ok:false, reason:"not-configured"};
  try {
    const resp = await fetch(cfg.url, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"}, // avoids CORS preflight against Apps Script
      body: JSON.stringify({secret: cfg.secret, ...body}),
      mode: "cors",
    });
    const data = await resp.json();
    if (!data.ok) return {ok:false, reason: data.error || "server error"};
    return data;
  } catch(e){
    return {ok:false, reason: String(e && e.message || e)};
  }
}
const saveQuestionToServer = (question) => postToServer({saveQuestion: question});
const deleteQuestionFromServer = (id) => postToServer({deleteQuestion: id});
const saveTestToServer = (test) => postToServer({saveTest: test});
const deleteTestFromServer = (id) => postToServer({deleteTest: id});
const saveRolesToServer = (roles) => postToServer({saveRoles: roles});

function getAllTests(){ return TESTS; }
// Kept as a passthrough — every call site already expects "the effective version of a
// test" as a concept, and now that TESTS itself is always the live server copy, that's
// simply the test object as-is.
function getEffectiveTest(t){ return t; }

function getEffectiveRoles(){ return ROLES; }
function getRoleById(id){ return ROLES.find(r => r.id === id) || ROLES[0]; }
// Intersects a role's saved test ids with tests that still actually exist — a role can
// reference a test deleted since, or simply predate one added since it was last saved.
function getVisibleTestsForRole(roleId){
  const role = getRoleById(roleId);
  if (!role || !Array.isArray(role.testIds)) return TESTS;
  const idSet = new Set(role.testIds);
  return TESTS.filter(t => idSet.has(t.id));
}

// Deletes a test on the server and drops it from the in-memory copy. Results tied to it
// keep their own copy of testLabel etc. and stay readable; only the test itself (and the
// ability to start a new attempt of it) goes away.
async function deleteTest(id){
  const res = await deleteTestFromServer(id);
  if (res.ok) TESTS = TESTS.filter(t => t.id !== id);
  return res;
}

function slugify(s){
  return String(s).toLowerCase()
    .replace(/[^a-zа-я0-9]+/gi, "_")
    .replace(/^_+|_+$/g, "") || "test";
}
function uniqueTestId(base){
  const existingIds = new Set(getAllTests().map(t => t.id));
  let id = "custom_" + slugify(base);
  let n = 2;
  while (existingIds.has(id)){ id = "custom_" + slugify(base) + "_" + n; n++; }
  return id;
}

// Validates one uploaded test object (the shape the admin's JSON file must match).
// Returns {ok:true, test} or {ok:false, errors:[...]}. Does not mutate `raw`.
function validateCustomTestObj(raw, indexLabel){
  const errors = [];
  const pfx = indexLabel ? `[${indexLabel}] ` : "";
  if (!raw || typeof raw !== "object") return { ok:false, errors:[pfx + "не объект JSON"] };
  const positionTitle = String(raw.positionTitle || "").trim();
  const label = String(raw.label || "").trim();
  if (!positionTitle) errors.push(pfx + "не указано «positionTitle» (должность)");
  if (!label) errors.push(pfx + "не указано «label» (категория/уровень)");
  const timeMinutes = raw.timeMinutes !== undefined ? Number(raw.timeMinutes) : 60;
  if (!Number.isFinite(timeMinutes) || timeMinutes <= 0) errors.push(pfx + "«timeMinutes» должно быть положительным числом");
  if (!Array.isArray(raw.sections) || raw.sections.length === 0){
    errors.push(pfx + "нет разделов «sections» (должен быть непустой массив)");
    return { ok:false, errors };
  }
  const sections = [];
  raw.sections.forEach((sec, si) => {
    const sTitle = String((sec && sec.title) || "").trim();
    const sPfx = `${pfx}раздел ${si+1}${sTitle ? " «" + sTitle + "»" : ""}: `;
    if (!sTitle) errors.push(sPfx + "не указан «title»");
    if (!sec || !Array.isArray(sec.questions) || sec.questions.length === 0){
      errors.push(sPfx + "нет вопросов «questions»");
      return;
    }
    const questions = [];
    sec.questions.forEach((q, qi) => {
      const qPfx = `${sPfx}вопрос ${qi+1}: `;
      const qText = String((q && q.q) || "").trim();
      if (!qText){ errors.push(qPfx + "не указан текст вопроса «q»"); return; }
      const options = Array.isArray(q.options) ? q.options.map(o => String(o).trim()) : [];
      if (options.length !== 8){ errors.push(qPfx + "должно быть ровно 8 вариантов «options» (сейчас " + options.length + ")"); return; }
      if (options.some(o => !o)){ errors.push(qPfx + "не все варианты заполнены"); return; }
      if (new Set(options).size !== 8){ errors.push(qPfx + "варианты должны быть уникальными"); return; }
      const correct = Array.isArray(q.correct) ? q.correct.map(Number) : [];
      if (!correct.length){ errors.push(qPfx + "не указан «correct» (индексы верных вариантов)"); return; }
      if (correct.some(ci => !Number.isInteger(ci) || ci < 0 || ci > 7)){ errors.push(qPfx + "«correct» содержит недопустимый индекс (должны быть числа 0–7)"); return; }
      questions.push({ q: qText, options, correct: [...new Set(correct)].sort((a,b)=>a-b) });
    });
    if (questions.length) sections.push({ title: sTitle, questions });
  });
  if (errors.length) return { ok:false, errors };
  const groupLabel = String(raw.groupLabel || positionTitle).trim();
  const group = raw.group ? String(raw.group).trim() : uniqueTestId(positionTitle);
  return {
    ok: true,
    test: {
      id: uniqueTestId(positionTitle + "_" + label),
      group, groupLabel, label, positionTitle, timeMinutes,
      sections,
    },
  };
}

// ---------- server sync (Google Sheets via Apps Script Web App) ----------
// SYNC_CONFIG_DEFAULT.url is baked into this file before distributing it to employees,
// so results are pushed automatically without anyone touching settings. Until it's set,
// the app falls back silently to the local export/import flow.
const SYNC_CONFIG_DEFAULT = { url: "https://script.google.com/macros/s/AKfycbwYt3LC3pYx0qtiJUE_vLtst_PpQQ_G9B7wI3vM39zUcjF0U6gnLugOnKRup-E8c_V27A/exec", secret: "beretta-sync-2026-x7f2" };
const LS_SYNC_OVERRIDE = "att_sync_cfg_override_v1";

function getSyncConfig(){
  try {
    const o = JSON.parse(localStorage.getItem(LS_SYNC_OVERRIDE));
    if (o && o.url) return o;
  } catch(e){}
  return SYNC_CONFIG_DEFAULT;
}
function setSyncOverride(cfg){ localStorage.setItem(LS_SYNC_OVERRIDE, JSON.stringify(cfg)); }
function syncConfigured(){ const c = getSyncConfig(); return !!(c && c.url); }

async function pushResultToServer(result){
  const cfg = getSyncConfig();
  if (!cfg.url) return {ok:false, reason:"not-configured"};
  try {
    await fetch(cfg.url, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"}, // avoids CORS preflight against Apps Script
      body: JSON.stringify({secret: cfg.secret, result}),
      mode: "cors",
    });
    return {ok:true};
  } catch(e){
    return {ok:false, reason: String(e && e.message || e)};
  }
}

async function deleteResultFromServer(id){
  const cfg = getSyncConfig();
  if (!cfg.url) return {ok:false, reason:"not-configured"};
  try {
    const resp = await fetch(cfg.url, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"}, // avoids CORS preflight against Apps Script
      body: JSON.stringify({secret: cfg.secret, deleteId: id}),
      mode: "cors",
    });
    const data = await resp.json();
    if (!data.ok) return {ok:false, reason: data.error || "server error"};
    return {ok:true};
  } catch(e){
    return {ok:false, reason: String(e && e.message || e)};
  }
}

async function pullResultsFromServer(){
  const cfg = getSyncConfig();
  if (!cfg.url) return {ok:false, reason:"not-configured"};
  try {
    const resp = await fetch(cfg.url + "?secret=" + encodeURIComponent(cfg.secret));
    const data = await resp.json();
    if (!data.ok) return {ok:false, reason: data.error || "server error"};
    const store = loadResults();
    const ids = new Set(store.map(x=>x.id));
    const deletedIds = new Set(loadDeletedIds());
    let imported = 0;
    (data.results || []).forEach(raw => {
      if (!raw || !raw.id || ids.has(raw.id) || deletedIds.has(raw.id)) return;
      const rec = {
        id: raw.id, login: raw.login, fullName: raw.fullName, testId: raw.testId,
        testLabel: raw.testLabel, label: raw.label, group: raw.group, groupLabel: raw.groupLabel,
        dateISO: raw.dateISO, totalQuestions: Number(raw.totalQuestions), correctCount: Number(raw.correctCount),
        percent: Number(raw.percent), bandLabel: raw.bandLabel, durationSec: Number(raw.durationSec),
        sections: typeof raw.sections === "string" ? JSON.parse(raw.sections) : raw.sections,
        details: typeof raw.details === "string" ? JSON.parse(raw.details) : (raw.details || []),
      };
      store.push(rec); ids.add(rec.id); imported++;
    });
    saveResults(store);
    return {ok:true, imported};
  } catch(e){
    return {ok:false, reason: String(e && e.message || e)};
  }
}

// Sends a user profile (login/password/fullName/createdAt) to the server so the admin
// can see it from any browser. Fire-and-forget from the caller's point of view — a
// failure here just means the admin won't see this account until the next successful
// sync; the local login itself (LS_PROFILES) is unaffected either way.
async function pushProfileToServer(profile){
  const cfg = getSyncConfig();
  if (!cfg.url) return {ok:false, reason:"not-configured"};
  try {
    await fetch(cfg.url, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"}, // avoids CORS preflight against Apps Script
      body: JSON.stringify({secret: cfg.secret, profile}),
      mode: "cors",
    });
    return {ok:true};
  } catch(e){
    return {ok:false, reason: String(e && e.message || e)};
  }
}

// Used when a login isn't found in this browser's own profile store — e.g. someone
// logging in on a different computer than the one they registered on, where the local
// LS_PROFILES here has never heard of that account. Pulls the full user list from the
// server and merges it into the LOCAL auth store (not just the admin's read-only synced
// copy), so the login check right after this can find it.
async function pullProfilesIntoLocalAuthStore(){
  const cfg = getSyncConfig();
  if (!cfg.url) return {ok:false, reason:"not-configured"};
  try {
    const resp = await fetch(cfg.url + "?secret=" + encodeURIComponent(cfg.secret) + "&type=users");
    const data = await resp.json();
    if (!data.ok) return {ok:false, reason: data.error || "server error"};
    const byLogin = {};
    loadProfiles().forEach(p => { byLogin[p.login] = p; });
    (data.users || []).forEach(raw => {
      if (!raw || !raw.login) return;
      const existing = byLogin[raw.login];
      const rawStamp = new Date(raw.updatedAt || raw.timestamp || 0).getTime();
      const existingStamp = existing ? new Date(existing.updatedAt || existing.timestamp || 0).getTime() : -1;
      if (existing && existingStamp >= rawStamp) return;
      byLogin[raw.login] = {
        // A fully-numeric password comes back from Google Sheets as a JS number, not a
        // string (the sheet cell isn't formatted as text) — String() it here, or it'll
        // never match what the login form reads out of a text input (always a string).
        login: raw.login, password: raw.password != null ? String(raw.password) : "", fullName: raw.fullName || "",
        role: raw.role || DEFAULT_ROLE_ID,
        createdAt: raw.createdAt || "", updatedAt: raw.updatedAt || raw.timestamp || "",
      };
    });
    saveProfiles(Object.values(byLogin));
    return {ok:true};
  } catch(e){
    return {ok:false, reason: String(e && e.message || e)};
  }
}

async function pullProfilesFromServer(){
  const cfg = getSyncConfig();
  if (!cfg.url) return {ok:false, reason:"not-configured"};
  try {
    const resp = await fetch(cfg.url + "?secret=" + encodeURIComponent(cfg.secret) + "&type=users");
    const data = await resp.json();
    if (!data.ok) return {ok:false, reason: data.error || "server error"};
    const byLogin = {};
    loadSyncedProfiles().forEach(p => { byLogin[p.login] = p; });
    let imported = 0;
    (data.users || []).forEach(raw => {
      if (!raw || !raw.login) return;
      const existing = byLogin[raw.login];
      // Keep whichever copy is newer (updatedAt/timestamp), so a stale pull never
      // clobbers a more recent one already cached locally.
      const rawStamp = new Date(raw.updatedAt || raw.timestamp || 0).getTime();
      const existingStamp = existing ? new Date(existing.updatedAt || existing.timestamp || 0).getTime() : -1;
      if (existing && existingStamp >= rawStamp) return;
      byLogin[raw.login] = {
        login: raw.login, password: raw.password != null ? String(raw.password) : "", fullName: raw.fullName || "",
        role: raw.role || DEFAULT_ROLE_ID,
        createdAt: raw.createdAt || "", updatedAt: raw.updatedAt || raw.timestamp || "",
      };
      imported++;
    });
    saveSyncedProfiles(Object.values(byLogin));
    return {ok:true, imported};
  } catch(e){
    return {ok:false, reason: String(e && e.message || e)};
  }
}

let loginTab = "login"; // login | register

// After a successful login/registration: go straight to the dashboard, unless ФИО is
// still blank (fresh registration), in which case nudge the person to fill in their
// profile first.
function postAuthRoute(fullName){
  if (!fullName){ route = "profile"; profileMsg = "Заполните ФИО, чтобы оно отображалось в результатах тестов."; }
  else { route = "dashboard"; dashboardGroup = null; }

function renderLogin(){
  appEl.innerHTML = `
    <div class="card" style="max-width:420px;margin:40px auto;">
      <h2>Личный кабинет</h2>
      <div class="tabs">
        <div class="tab ${loginTab==="login"?"active":""}" id="tabLogin">Войти</div>
        <div class="tab ${loginTab==="register"?"active":""}" id="tabRegister">Зарегистрироваться</div>
      </div>
      <p class="muted small">${loginTab==="login"
        ? "Введите логин и пароль вашего профиля."
        : "Придумайте логин и пароль — ФИО можно будет указать сразу после регистрации, в профиле."}</p>
      <label for="fLogin">Логин</label>
      <input type="text" id="fLogin" placeholder="">
      <label for="fPass">Пароль</label>
      <input type="password" id="fPass" placeholder="">
      <div class="row">
        <button class="btn" id="btnAuth">${loginTab==="login" ? "Войти" : "Зарегистрироваться"}</button>
      </div>
      <p class="small muted" id="loginMsg" style="margin-top:10px;"></p>
    </div>
  `;
  document.getElementById("tabLogin").onclick = () => { loginTab = "login"; render(); };
  document.getElementById("tabRegister").onclick = () => { loginTab = "register"; render(); };

  document.getElementById("btnAuth").onclick = async () => {
    const login = document.getElementById("fLogin").value.trim().toLowerCase();
    const pass = document.getElementById("fPass").value;
    const msg = document.getElementById("loginMsg");
    if (!login || !pass){ msg.textContent = "Заполните логин и пароль."; return; }

    if (loginTab === "login"){
      let profiles = loadProfiles();
      let p = profiles.find(x => x.login === login);
      // Not known on this computer — try the server before giving up, in case this
      // account was registered elsewhere and just never logged in from here before.
      if (!p && syncConfigured()){
        msg.innerHTML = spinnerInlineHtml("На этом компьютере такого логина нет, проверяю на сервере — это может занять до 30 секунд при первом заходе…");
        const res = await pullProfilesIntoLocalAuthStore();
        profiles = loadProfiles();
        p = profiles.find(x => x.login === login);
        if (!p && !res.ok){
          msg.textContent = "Такого логина нет на этом компьютере, а проверить на сервере не удалось (" + res.reason + "). Проверьте интернет и повторите.";
          return;
        }
      }
      if (!p){ msg.textContent = "Такого логина нет. Нажмите «Зарегистрироваться»."; return; }
      if (String(p.password) !== pass){ msg.textContent = "Неверный пароль для этого логина."; return; }
      setSession({login: p.login, fullName: p.fullName, role: p.role || DEFAULT_ROLE_ID});
      pushProfileToServer(p); // keeps the admin's server-side Users list current, incl. accounts created before this synced
      postAuthRoute(p.fullName);
      render();
    } else {
      const profiles = loadProfiles();
      if (profiles.some(x => x.login === login)){ msg.textContent = "Такой логин уже занят. Нажмите «Войти» или выберите другой логин."; return; }
      const p = {login, password: pass, fullName: "", role: DEFAULT_ROLE_ID, createdAt: new Date().toISOString()};
      profiles.push(p);
      saveProfiles(profiles);
      pushProfileToServer(p);
      setSession({login: p.login, fullName: p.fullName, role: p.role});
      postAuthRoute(p.fullName);
      render();
    }
  };
}

    el.onclick = () => { dashboardGroup = el.dataset.group; render(); };
  });
  const backBtn = document.getElementById("btnBackToGroups");
  if (backBtn) backBtn.onclick = () => { dashboardGroup = null; render(); };
  appEl.querySelectorAll(".test-tile[data-test]").forEach(el => {
    el.onclick = () => startTest(el.dataset.test);
  });
  appEl.querySelectorAll(".test-tile[data-locked]").forEach(el => {
    el.onclick = () => alert("Продвинутое тестирование по этой категории пока недоступно: сначала нужно пройти первичное тестирование по той же категории с оценкой не ниже «удовлетворительно».");
  });
  appEl.querySelectorAll("[data-export]").forEach(el => {
    el.onclick = () => {
      const r = results.find(x => x.id === el.dataset.export);
      downloadJSON([r], `attestation_result_${r.login}_${r.testId}_${r.id}.json`);
    };
  });
  appEl.querySelectorAll("[data-resend]").forEach(el => {
    el.onclick = () => {
      const r = results.find(x => x.id === el.dataset.resend);
      const statusEl = appEl.querySelector(`[data-resend-status="${r.id}"]`);
      el.disabled = true;
      if (statusEl) statusEl.textContent = "Отправляю…";
      pushResultToServer(r).then(res => {
        el.disabled = false;
        if (statusEl) statusEl.textContent = res.ok ? "Отправлено ✓" : `Не удалось: ${res.reason}`;
      });
    };
  });
  const exportAllBtn = document.getElementById("exportAll");
  if (exportAllBtn) exportAllBtn.onclick = () => downloadJSON(results, `attestation_results_${s.login}_all.json`);
}

// ---------- TEST TAKING ----------
function startTest(testId, forceRestart){
  const s = getSession();
  const rawMeta = getAllTests().find(t => t.id === testId);
  if (!rawMeta){ alert("Этот тест больше недоступен (удалён администратором)."); route = "dashboard"; render(); return; }
  if (s){
    const loginResults = loadResults().filter(r => r.login === s.login);
    if (isTestLocked(rawMeta, s, loginResults)){
      alert("Продвинутое тестирование по этой категории пока недоступно: сначала нужно пройти первичное тестирование по той же категории с оценкой не ниже «удовлетворительно».");
      route = "dashboard"; render(); return;
    }
  }
  const meta = getEffectiveTest(rawMeta);
  const saved = (!forceRestart && s) ? getInProgress(s.login, testId) : null;

  if (saved){
    const answeredCount = saved.answers.filter(a => a.length > 0).length;
    const resume = confirm(
      `У вас есть незавершённая попытка этого теста (отвечено ${answeredCount} из ${saved.flat.length}, вы остановились на вопросе ${saved.idx+1}).\n\n` +
      `ОК — продолжить с этого места.\nОтмена — начать заново (сохранённый прогресс будет потерян).`
    );
    if (resume){
      const flat = saved.flat.map(q => ({
        sectionTitle: q.sectionTitle, q: q.q, displayOptions: q.displayOptions,
        correctSet: new Set(q.correctIdx), isMulti: q.isMulti,
      }));
      currentTest = {...meta, id: testId, flat};
      currentAttempt = { answers: saved.answers.map(a => new Set(a)), startedAt: saved.startedAt, idx: Math.min(saved.idx, flat.length-1) };
      route = "test";
      render();
      return;
    }
    clearInProgress(s.login, testId);
  }

  // Build a flat runtime question list with shuffled option order, tagged with section title.
  // The question bank itself (admin view) keeps the fixed section order; only this
  // per-attempt runtime copy gets its question order shuffled, freshly on every start.
  let flat = [];
  meta.sections.forEach(sec => {
    sec.questions.forEach(q => {
      const order = shuffle(q.options.map((_, i) => i));
      flat.push({
        sectionTitle: sec.title,
        q: q.q,
        displayOptions: order.map(i => q.options[i]),
        correctSet: new Set(q.correct.map(origIdx => order.indexOf(origIdx))),
        isMulti: q.correct.length > 1,
      });
    });
  });
  flat = shuffle(flat);
  currentTest = {...meta, flat};
  currentAttempt = { answers: flat.map(()=>new Set()), startedAt: Date.now(), idx: 0 };
  route = "test";
  render();
  saveCurrentProgress();
}

function renderTest(){
  const t = currentTest;
  const i = currentAttempt.idx;
  const total = t.flat.length;
  const q = t.flat[i];
  const answered = t.flat.filter((_,k)=>currentAttempt.answers[k].size>0).length;

  const optsHtml = q.displayOptions.map((opt, oi) => {
    const checked = currentAttempt.answers[i].has(oi) ? "checked" : "";
    const type = q.isMulti ? "checkbox" : "radio";
    return `<label class="opt"><input type="${type}" name="opt" data-oi="${oi}" ${checked}> <span>${escapeHtml(opt)}</span></label>`;
  }).join("");

  const isLast = i === total - 1;
  appEl.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center;">
        <div><strong>${escapeHtml(t.positionTitle)}</strong> — ${escapeHtml(t.label)}</div>
        <div class="small muted">Отвечено: ${answered}/${total}</div>
      </div>
      <div class="row" style="justify-content:space-between;align-items:center;">
        <button class="btn ghost" id="btnPrev" ${i===0?"disabled":""}>Назад</button>
        <button class="btn secondary" id="btnNext" ${isLast?"disabled":""}>Далее</button>
      </div>
      <div class="progress-bar"><div style="width:${(answered/total*100).toFixed(0)}%"></div></div>
      <div class="q-block">
        <div class="q-num">Вопрос ${i+1} из ${total}</div>
        <div class="q-text">${escapeHtml(q.q)}</div>
        ${q.isMulti ? `<div class="q-hint">(возможно более одного правильного варианта)</div>` : ""}
        ${optsHtml}
      </div>
      <div class="row" style="justify-content:flex-end;margin-top:14px;">
        <button class="btn ghost" id="btnQuit" style="font-size:12px;padding:2px 10px;opacity:0.65;">Прервать тест</button>
      </div>
    </div>
    ${isLast ? `
    <div class="card" style="border-color:var(--accent);">
      <h2>Завершение теста</h2>
      <p class="small muted">Это последний вопрос. Отвечено: ${answered} из ${total}. Кнопкой «Назад» можно ещё раз просмотреть и изменить любой ответ перед отправкой.</p>
      <button class="btn" id="btnFinish">Завершить и получить результат</button>
    </div>` : ""}
  `;
  appEl.querySelectorAll('input[name="opt"]').forEach(inp => {
    inp.onchange = () => {
      const oi = Number(inp.dataset.oi);
      if (q.isMulti){
        if (inp.checked) currentAttempt.answers[i].add(oi); else currentAttempt.answers[i].delete(oi);
      } else {
        currentAttempt.answers[i] = new Set([oi]);
      }
      saveCurrentProgress();
    };
  });
  const confirmUnanswered = () => currentAttempt.answers[i].size > 0
    || confirm("Вы не выбрали ответ на этот вопрос. Всё равно перейти к другому вопросу?");
  document.getElementById("btnPrev").onclick = () => { if (!confirmUnanswered()) return; currentAttempt.idx--; saveCurrentProgress(); renderTest(); };
  document.getElementById("btnNext").onclick = () => { if (!confirmUnanswered()) return; currentAttempt.idx++; saveCurrentProgress(); renderTest(); };
  document.getElementById("btnQuit").onclick = () => {
    if (confirm("Прервать тест сейчас? Ваши ответы сохранятся — вы сможете продолжить с этого места позже. Итоговый результат отправлен не будет, пока вы не завершите тест.")){
      currentTest=null; currentAttempt=null; route="dashboard"; render();
    }
  };
  const finishBtn = document.getElementById("btnFinish");
  if (finishBtn) finishBtn.onclick = () => {
    const unanswered = total - answered;
    const warn = unanswered > 0 ? `\n\nВнимание: не отвечено на ${unanswered} вопрос(ов) — они будут засчитаны как неверные.` : "";
    if (confirm(`Завершить тест и отправить результат? Ответы после этого изменить будет нельзя.${warn}`)){
      finishTest();
    }
  };
}

let isFinishingTest = false;
function finishTest(){
  // Cheap insurance against a duplicate result row — in practice this function already
  // can't run twice from a real double-click (confirm() blocks the event loop, and the
  // whole function runs synchronously through render() swapping the button away before
  // any network call starts), but guarding costs nothing and covers any future refactor
  // that adds an await before that point.
  if (isFinishingTest) return;
  isFinishingTest = true;
  const t = currentTest;
  const s = getSession();
  const sectionStats = {};
  let correctCount = 0;
  const details = [];
  t.flat.forEach((q, i) => {
    const given = currentAttempt.answers[i];
    const isCorrect = given.size === q.correctSet.size && [...given].every(x => q.correctSet.has(x));
    if (isCorrect) correctCount++;
    const st = sectionStats[q.sectionTitle] = sectionStats[q.sectionTitle] || {total:0, correct:0};
    st.total++;
    if (isCorrect) st.correct++;
    // Self-contained snapshot of this question as shown (shuffled options + which were
    // correct/given), so the attempt can be reviewed or printed later even if the
    // question bank changes afterward.
    details.push({
      sectionTitle: q.sectionTitle,
      q: q.q,
      options: q.displayOptions,
      correctIdx: [...q.correctSet].sort((a,b)=>a-b),
      givenIdx: [...given].sort((a,b)=>a-b),
      isCorrect,
    });
  });
  const total = t.flat.length;
  const percent = total ? (correctCount/total*100) : 0;
  const band = bandFor(percent);
  const durationSec = Math.round((Date.now() - currentAttempt.startedAt)/1000);
  const sections = Object.keys(sectionStats).map(title => {
    const st = sectionStats[title];
    return {title, total: st.total, correct: st.correct, percent: st.total ? st.correct/st.total*100 : 0};
  });

  const result = {
    id: uid(),
    login: s.login,
    fullName: s.fullName,
    testId: t.id,
    testLabel: t.positionTitle,
    label: t.label,
    group: t.group,
    groupLabel: t.groupLabel,
    dateISO: new Date().toISOString(),
    totalQuestions: total,
    correctCount,
    percent,
    bandLabel: band.label,
    durationSec,
    sections,
    details,
  };
  const results = loadResults();
  results.push(result);
  saveResults(results);
  if (s) clearInProgress(s.login, t.id);
  lastResult = result;
  lastSyncStatus = syncConfigured() ? "sending" : "not-configured";
  currentTest = null; currentAttempt = null;
  route = "result";
  render();
  isFinishingTest = false; // safe to reset now — the "Завершить" button is gone from the DOM
  if (syncConfigured()){
    pushResultToServer(result).then(res => {
      lastSyncStatus = res.ok ? "sent" : "failed";
      if (route === "result" && lastResult && lastResult.id === result.id) renderResult();
    });
  }
}

// ---------- RESULT ----------
let lastSyncStatus = "not-configured"; // not-configured | sending | sent | failed
function renderResult(){
  const r = lastResult;
  const b = bandFor(r.percent);
  const sectionRows = r.sections.map(sec => {
    const sb = bandFor(sec.percent);
    return `<tr><td>${escapeHtml(sec.title)}</td><td>${sec.correct}/${sec.total}</td><td><span class="pill ${sb.cls}">${sec.percent.toFixed(0)}%</span></td></tr>`;
  }).join("");
  const syncLine = {
    "not-configured": `<p class="small muted">Автоотправка результата не настроена — передайте файл администратору вручную.</p>`,
    "sending": `<p class="small muted">Отправляю результат администратору…</p>`,
    "sent": `<p class="small" style="color:var(--good);">✓ Результат отправлен администратору автоматически.</p>`,
    "failed": `<p class="small" style="color:var(--bad);">Не удалось отправить автоматически (нет интернета?). Экспортируйте результат и передайте администратору вручную.</p>`,
  }[lastSyncStatus];
  appEl.innerHTML = `
    <div class="card" style="text-align:center;">
      <div class="muted">${escapeHtml(r.testLabel)} — ${escapeHtml(r.label)}</div>
      <div class="score-big band-${b.cls}">${r.percent.toFixed(1)}%</div>
      <div class="muted">${r.correctCount} из ${r.totalQuestions} правильных ответов</div>
      <div style="margin-top:10px;"><span class="pill ${b.cls}" style="font-size:14px;padding:6px 16px;">${b.label}</span></div>
      ${syncLine}
    </div>
    <div class="card">
      <h2>Результаты по разделам</h2>
      <table><thead><tr><th>Раздел</th><th>Верно</th><th>%</th></tr></thead><tbody>${sectionRows}</tbody></table>
    </div>
    <div class="row">
      <button class="btn" id="btnToDash">В кабинет</button>
      <button class="btn secondary" id="btnExportOne">Экспортировать результат (для админа)</button>
    </div>
  `;
  document.getElementById("btnToDash").onclick = () => { route="dashboard"; render(); };
  document.getElementById("btnExportOne").onclick = () => downloadJSON([r], `attestation_result_${r.login}_${r.testId}_${r.id}.json`);
}

let lastImportMsg = "";
let lastSyncPullMsg = "";
let autoSyncDone = false;
let lastCustomTestMsg = "";
let lastCustomTestMsgColor = "";
function renderAdmin(){
  if (!isAdmin()){
    appEl.innerHTML = `
      <div class="card" style="max-width:400px;margin:40px auto;">
        <h2>Вход для администратора</h2>
        <label for="aPass">Пароль администратора</label>
        <input type="password" id="aPass">
        <button class="btn" id="aBtn">Войти</button>
        <p class="small muted" id="aMsg" style="margin-top:10px;"></p>
      </div>`;
    document.getElementById("aBtn").onclick = () => {
      if (document.getElementById("aPass").value === ADMIN_PASSWORD){
        sessionStorage.setItem(LS_ADMIN, "1");
        renderAdmin();
      } else {
        document.getElementById("aMsg").textContent = "Неверный пароль.";
      }
    };
    return;
  }

  if (syncConfigured() && !autoSyncDone){
    autoSyncDone = true;
    lastSyncPullMsg = "Загружаю результаты и пользователей с сервера…";
    Promise.all([pullResultsFromServer(), pullProfilesFromServer()]).then(([resResults, resUsers]) => {
      lastSyncPullMsg = (resResults.ok && resUsers.ok)
        ? `Синхронизировано ${fmtDate(new Date().toISOString())}: новых результатов — ${resResults.imported}, новых/обновлённых пользователей — ${resUsers.imported}.`
        : `Не удалось синхронизироваться: ${resResults.reason || resUsers.reason}`;
      if (route === "admin") renderAdmin();
    });
  }

  const results = loadResults();
  // Merge every known source of accounts: profiles synced from the server (other
  // browsers/employees), this browser's own local profiles (e.g. the admin's own
  // account), and — as a last-resort fallback for accounts registered before this
  // feature existed — logins that only show up on a result record (no password known).
  const users = {};
  loadSyncedProfiles().forEach(p => {
    users[p.login] = {login: p.login, fullName: p.fullName, password: p.password, role: p.role || DEFAULT_ROLE_ID, createdAt: p.createdAt, attempts: []};
  });
  loadProfiles().forEach(p => {
    users[p.login] = {...(users[p.login]||{attempts:[]}), login: p.login, fullName: p.fullName, password: p.password, role: p.role || DEFAULT_ROLE_ID, createdAt: p.createdAt};
  });
  results.forEach(r => {
    if (!users[r.login]) users[r.login] = {login: r.login, fullName: r.fullName, password: null, role: DEFAULT_ROLE_ID, createdAt: null, attempts: []};
    users[r.login].attempts.push(r);
  });
  const userLogins = Object.keys(users).sort();

  let overviewRows = "";
  userLogins.forEach(login => {
    const u = users[login];
    const best = {};
    u.attempts.forEach(a => {
      if (!best[a.testId] || a.percent > best[a.testId].percent) best[a.testId] = a;
    });
    const cells = Object.values(best).map(a => {
      const b = bandFor(a.percent);
      return `<span class="pill ${b.cls}" title="${escapeHtml(a.testLabel)} — ${escapeHtml(a.label)}">${escapeHtml(a.label)} ${a.percent.toFixed(0)}%</span>`;
    }).join(" ");
    const roleOptionsHtml = getEffectiveRoles().map(r =>
      `<option value="${escapeHtml(r.id)}" ${r.id === (u.role || DEFAULT_ROLE_ID) ? "selected" : ""}>${escapeHtml(r.name)}</option>`
    ).join("");
    overviewRows += `<tr>
      <td>${escapeHtml(u.fullName || "(ФИО не заполнено)")}</td>
      <td class="small muted">${escapeHtml(login)}</td>
      <td class="small">${u.password ? escapeHtml(u.password) : `<span class="muted">неизвестен</span>`}</td>
      <td><select class="user-role-select" data-login="${escapeHtml(login)}" style="font-size:12px;padding:2px 4px;">${roleOptionsHtml}</select></td>
      <td class="small muted">${u.createdAt ? fmtDate(u.createdAt) : "—"}</td>
      <td>${u.attempts.length}</td>
      <td>${cells}</td>
      <td><button class="btn ghost" data-user="${escapeHtml(login)}">Подробнее</button></td>
    </tr>`;
  });

  const cfg = getSyncConfig();
  const allTestsList = getAllTests();

  const rolesList = getEffectiveRoles();
  const rolesHtml = rolesList.map(role => {
    // Mirror getVisibleTestsForRole logic: non-array testIds means "all tests visible"

      ? new Set(role.testIds)
      : new Set(allTestsList.map(t => t.id));

      <label class="small" style="display:flex;align-items:center;gap:5px;">
        <input type="checkbox" class="role-test-cb" data-role="${escapeHtml(role.id)}" data-test="${escapeHtml(t.id)}" ${testIds.has(t.id) ? "checked" : ""}>
        ${escapeHtml(t.positionTitle)} — ${escapeHtml(t.label)}
      </label>`).join("");
    return `
      <div class="q-block" style="margin-bottom:16px;">
        <div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <input type="text" class="role-name-input" data-role="${escapeHtml(role.id)}" value="${escapeHtml(role.name)}" style="max-width:280px;">
          ${role.id === DEFAULT_ROLE_ID
            ? `<span class="small muted">роль по умолчанию для новых пользователей</span>`
            : `<button class="btn ghost" data-del-role="${escapeHtml(role.id)}" style="color:var(--bad);border-color:var(--bad);">Удалить роль</button>`}
        </div>
        <div class="small muted" style="margin:8px 0 4px;">Видимые тесты:</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px 20px;">${checkboxesHtml}</div>
      </div>`;
  }).join("");

      ${rolesHtml}
      <button class="btn secondary" id="btnAddRole">+ Добавить роль</button>
    </div>
    <div class="card">
      <h2>Синхронизация с сервером (Google-таблица)</h2>
      ${syncConfigured()
        ? `<p class="small">Статус: <strong style="color:var(--good);">настроено</strong>. Результаты сотрудников прилетают сюда автоматически.</p>
           <p class="small muted">${escapeHtml(lastSyncPullMsg)}</p>
           <div class="row"><button class="btn secondary" id="btnSyncNow">Синхронизировать сейчас</button></div>`
        : `<p class="small muted">Автосбор результатов пока не настроен — используется ручной импорт файлов ниже. Чтобы включить автоматику, разверните Google Apps Script по инструкции и укажите ссылку здесь (сохранится только в этом браузере) или попросите зашить её в сам файл для всех сотрудников.</p>
           <div class="row" style="align-items:flex-end;">
             <div style="flex:1;"><label for="syncUrl">Web App URL</label><input type="text" id="syncUrl" placeholder="https://script.google.com/macros/s/.../exec" value="${escapeHtml(cfg.url||"")}"></div>
             <div style="width:220px;"><label for="syncSecret">Секретный ключ</label><input type="text" id="syncSecret" value="${escapeHtml(cfg.secret||"")}"></div>
           </div>
           <button class="btn secondary" id="btnSaveSync">Сохранить (только в этом браузере)</button>`}
    </div>

    </div>
